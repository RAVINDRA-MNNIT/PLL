<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pro Learner's Digital Library - Login</title>

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

<div class="login-container">

    <h1>📚 Pro Learner's Digital Library</h1>

    <p class="subtitle">Library Login Portal</p>

    <form id="loginForm">

        <label for="userType">User Type</label>

        <select id="userType">
            <option value="">-- Select Login Type --</option>
            <option value="Manager">Manager</option>
            <option value="Admin">Admin</option>
        </select>

        <label id="personLabel" for="personName">
            Select Person
        </label>

        <select id="personName" disabled>
            <option value="">
                -- Select User Type First --
            </option>
        </select>

        <label for="password">Password</label>

        <input
                type="password"
                id="password"
                placeholder="Enter 8 Character Password"
        >

        <div id="errorMsg" class="error"></div>

        <button id="loginButton" type="submit">
            Login
        </button>

    </form>

    <div class="footer">
        © 2026 Pro Learner's Digital Library
    </div>

</div>
<script src="/js/api.js"></script>
<script src="/js/login.js"></script>

</body>
</html>
