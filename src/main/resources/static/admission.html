<section id="newAdmissionSubview" class="admission-subview">
  <div class="admission-card">
    <div class="admission-heading">
      <h2>New Admission</h2>
      <p>Create a new member application and send it to Admin for approval.</p>
    </div>
<form id="studentRegistrationForm" class="form-grid">

        <div class="form-group">
          <label for="studentName">Full Name *</label>
          <input id="studentName" name="fullName" type="text"
                 placeholder="Enter Full Name" required>
        </div>

        <div class="form-group">
          <label for="dateOfBirth">Date of Birth</label>
          <input id="dateOfBirth" name="dateOfBirth" type="date" required>
        </div>

        <div class="form-group">
          <label for="studentMobile">Mobile Number *</label>
          <input id="studentMobile" name="mobile" type="tel"
                 inputmode="numeric" maxlength="10"
                 pattern="[0-9]{10}" placeholder="10 digit mobile number" required>
        </div>

        <div class="form-group">
          <label for="guardianNumber">Guardian Number</label>
          <input id="guardianNumber" name="guardianNumber" type="tel"
                 inputmode="numeric" maxlength="10"
                 pattern="[0-9]{10}" placeholder="10 digit guardian number">
        </div>

        <div class="form-group">
          <label for="fatherName">Father Name</label>
          <input id="fatherName" name="fatherName" type="text"
                 placeholder="Enter Father Name">
        </div>

        <div class="form-group full">
          <label for="localAddress">Local Address *</label>
          <textarea id="localAddress" name="localAddress" rows="3"
                    placeholder="Enter Local Address" required></textarea>
        </div>

        <div class="form-group full">
          <label style="display:flex;align-items:center;gap:8px;font-weight:500;margin-bottom:4px">
            <input id="sameAsLocalAddress" type="checkbox" style="width:auto"
                   onchange="togglePermanentAddress()">
            Permanent address is same as local address
          </label>
          <label for="permanentAddress">Permanent Address *</label>
          <textarea id="permanentAddress" name="permanentAddress" rows="3"
                    placeholder="Enter Permanent Address" required></textarea>
        </div>

        <div class="form-group">
          <label for="aadharNumber">Aadhaar Card Number *</label>
          <input id="aadharNumber" name="aadharNumber" type="text"
                 inputmode="numeric" maxlength="12"
                 pattern="[0-9]{12}" placeholder="12 digit Aadhaar number" required>
        </div>

        <div class="form-group">
          <label for="qualification">Qualification</label>
          <select id="qualification" name="qualification">
            <option value="">-- Select Qualification --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="studentBatch">Batch *</label>
          <select id="studentBatch" name="batchId" required>
            <option value="">-- Select Batch --</option>
          </select>
        </div>

        <div class="form-group" id="seatGroup" style="display:none;">
          <label for="seatNumber">Seat Number *</label>
          <select id="seatNumber" name="seatNumber">
              <option value="">-- Select Seat --</option>
          </select>
       </div>

        <div class="form-group">
          <label for="preparationFor">Preparation For</label>
          <select id="preparationFor" name="preparationFor">
            <option value="">-- Select Preparation --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="membershipFrom">Membership From *</label>
          <input id="membershipFrom" name="membershipFrom" type="date" required>
        </div>

        <div class="form-group">
          <label for="membershipTill">Membership Till *</label>
          <input id="membershipTill" name="membershipTill" type="date" required>
        </div>

        <div class="form-group">
          <label for="submittedAmount">Submitted Amount</label>
          <input id="submittedAmount" name="submittedAmount" type="number"
                 min="0" step="1" placeholder="Amount submitted" required>
        </div>

        <div class="form-group">
          <label for="discount">Discount</label>
          <input id="discount" name="discount" type="number"
                 min="0" step="1" value="0" placeholder="Discount amount">
        </div>

        <div class="form-group">
          <label for="pendingAmount">Pending Amount</label>
          <input id="pendingAmount" name="pendingAmount" type="number"
                 min="0" step="1" value="0" placeholder="Pending amount">
        </div>

          <div class="form-group full">
      <label>Payment Mode *</label>

      <div style="display:flex;gap:30px;margin-top:8px;">

          <label style="display:flex;align-items:center;gap:8px;font-weight:500;">
              <input
                  type="radio"
                  name="paymentMode"
                  value="CASH"
                  checked
                  onchange="togglePaymentMode()">
              Cash
          </label>

          <label style="display:flex;align-items:center;gap:8px;font-weight:500;">
              <input
                  type="radio"
                  name="paymentMode"
                  value="ONLINE"
                  onchange="togglePaymentMode()">
              Online
          </label>

      </div>
  </div>

<div id="onlinePaymentSection" class="form-group full" style="display:none;">

    <label for="transactionId">
        Transaction ID / UTR Number
    </label>

    <input
        type="text"
        id="transactionId"
        placeholder="Enter UPI / Bank Transaction ID">

    <label for="paymentRemarks" style="margin-top:12px;">
        Payment Description
    </label>

    <textarea
        id="paymentRemarks"
        rows="2"
        placeholder="Example:
Paid through Google Pay
Transaction successful"></textarea>

</div>

        <div id="registrationMessage" class="form-message" aria-live="polite"></div>

        <div class="form-actions">
          <button type="reset" class="secondary-btn">Clear</button>
          <button id="registerStudentButton" type="submit" class="primary-btn">
            Add New Member
          </button>
        </div>
      </form>
  </div>
</section>

<style>
.admission-subview{width:100%}
.admission-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:24px}
.admission-heading{margin-bottom:22px}
.admission-heading h2{margin:0 0 6px;color:#0f172a}
.admission-heading p{margin:0;color:#64748b}
.admission-subview .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.admission-subview .form-group{display:flex;flex-direction:column;gap:7px}
.admission-subview .form-group.full{grid-column:1/-1}
.admission-subview label{font-weight:600;color:#334155}
.admission-subview input,.admission-subview select,.admission-subview textarea{
  width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:6px;font:inherit;background:#fff
}
.admission-subview textarea{resize:vertical}
.admission-subview .form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:12px;margin-top:4px}
.admission-subview button{border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer}
.admission-subview .primary-btn{background:#2563eb;color:#fff}
.admission-subview .secondary-btn{background:#e2e8f0;color:#0f172a}
.admission-subview .form-message{grid-column:1/-1;padding:0}
.admission-subview .form-message.success{padding:12px;background:#dcfce7;color:#15803d;border-radius:6px}
.admission-subview .form-message.error{padding:12px;background:#fee2e2;color:#b91c1c;border-radius:6px}
@media(max-width:800px){.admission-subview .form-grid{grid-template-columns:1fr}.admission-subview .form-group.full{grid-column:auto}}
</style>
