<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Learner's Digital Library - Student Login</title>

    <link rel="stylesheet" href="/css/student-login.css">
</head>

<body>

<div class="login-container">

    <h1>📚 Pro Learner's Digital Library</h1>

    <p class="subtitle">
        Student Login Portal
    </p>

    <form id="studentLoginForm">

        <label for="studentId">
            Student ID
        </label>

        <input
                type="number"
                id="studentId"
                placeholder="Enter Student ID"
                autocomplete="off"
                required>

        <label for="password">
            Password
        </label>

        <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required>

        <div class="password-note">

            <strong>ℹ️ Default Password</strong>

            <p>
                First <b>2 letters</b> of your name (uppercase)
                +
                Last <b>3 digits</b> of your mobile number
                +
                <b>Birth year</b>.
            </p>

            <div class="example">

                <strong>Example</strong>

                <table>

                    <tr>
                        <td>Name</td>
                        <td>Peter Parker</td>
                    </tr>

                    <tr>
                        <td>Mobile</td>
                        <td>1234567890</td>
                    </tr>

                    <tr>
                        <td>DOB</td>
                        <td>13/06/1988</td>
                    </tr>

                    <tr class="password-row">
                        <td>Password</td>
                        <td><strong>PE8901988</strong></td>
                    </tr>

                </table>

            </div>

        </div>

        <div id="errorMsg" class="error"></div>

        <button id="loginButton" type="submit">
            Login
        </button>

    </form>

    <div class="footer">
        © 2026 Pro Learner's Digital Library
    </div>

</div>
<script src="/js/api.js"></script>
<script src="/js/endpoints.js"></script>
<script src="/js/session.js"></script>
<script src="/js/lookups.js"></script>
<script src="/js/loader.js"></script>
<script src="/js/student-login.js"></script>

</body>

</html>
