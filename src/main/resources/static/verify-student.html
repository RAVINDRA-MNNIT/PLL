<div class="verify-student-card">
    <!-- Verify Form -->
    <div id="verifyStudentForm" class="verify-student-form">
        <div class="form-group">
            <label for="verifyMembershipId">
                Membership ID
            </label>
            <input type="number" id="verifyMembershipId" placeholder="Enter Student ID" min="1" autocomplete="off">
        </div>
        <button type="button" class="btn btn-primary" id="verifyStudentBtn">
            <i class="fa-solid fa-check"></i>
            Verify
        </button>
        <button type="button" class="btn btn-secondary" id="openStudentDetailBtn">
            <i class="fa-solid fa-user"></i>
            Open Detail
        </button>
    </div>
    <!-- Verification Result -->
    <div id="verifyStudentResult" class="verify-student-result" style="display:none;">
    </div>
</div>
