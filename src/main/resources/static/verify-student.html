<div class="verify-student-card">

    <!-- Verify Form -->
    <div id="verifyStudentForm" class="verify-student-form">

        <div class="form-group">
            <label for="verifyMembershipId">
                Membership ID
            </label>

            <input
                    type="text"
                    id="verifyMembershipId"
                    placeholder="Student ID"
                    inputmode="numeric"
                    pattern="[0-9]{1,10}"
                    maxlength="10"
                    autocomplete="off">
        </div>

        <button
                type="button"
                class="btn btn-primary"
                id="verifyStudentBtn">
            <i class="fa-solid fa-check"></i>
            Verify
        </button>

        <button
                type="button"
                class="btn btn-secondary"
                id="openStudentDetailBtn">
            <i class="fa-solid fa-user"></i>
            Open Detail
        </button>

    </div>


    <!-- Verification Result -->
    <div
            id="verifyStudentResult"
            class="verify-student-result"
            style="display: none;">

        <div class="student-result-card">

            <!-- Header -->
            <div class="student-result-header">

                <div
                        id="resultLibraryName"
                        class="student-result-library">
                    Library Name
                </div>

                <div class="student-result-title">
                    STUDENT
                </div>

            </div>


            <!-- Body -->
            <div class="student-result-body">

                <div
                        id="resultStudentName"
                        class="student-result-name">
                    -
                </div>

                <div class="student-result-id">
                    Student ID:
                    <strong id="resultStudentId">
                        -
                    </strong>
                </div>


                <!-- Details -->
                <div class="student-result-details">
                    <div class="student-result-row">
                        <span>Mobile</span>
                        <strong id="resultMobile">-</strong>
                    </div>
                    <div class="student-result-row">
                        <span>Batch</span>
                        <strong id="resultBatch">-</strong>
                    </div>

                    <div class="student-result-row">
                        <span>Seat</span>
                        <strong id="resultSeat">-</strong>
                    </div>

                    <div class="student-result-row">
                        <span>Valid Till</span>
                        <strong id="resultTillDate">-</strong>
                    </div>

                    <div class="student-result-row">
                        <span>Status</span>
                        <strong
                                id="resultStatus"
                                class="student-result-status">
                            -
                        </strong>
                    </div>
                    <div class="student-result-row">
                        <span>Pending Approval Count</span>
                        <strong id="resultPendingApproval">-</strong>
                    </div>
                </div>

            </div>


            <!-- Issues -->
            <div
                    id="studentIssues"
                    class="student-id-issues">

                <div class="issues-header">

        <span class="issues-label">
            Issues
        </span>

                    <span
                            id="issuesSummary"
                            class="issues-summary good">

            <i class="fa-solid fa-circle-check"></i>
            All Good

        </span>

                </div>

                <div
                        id="studentIssuesList"
                        class="issues-list">
                </div>

            </div>


            <!-- Actions -->
            <div
                    id="studentActions"
                    class="student-id-actions">

                <div class="actions-header">

        <span class="actions-label">
            Action
        </span>

                    <span
                            id="actionsSummary"
                            class="actions-summary">

            <i class="fa-solid fa-circle-check"></i>
            No Action Required

        </span>

                </div>

                <div
                        id="studentActionsList"
                        class="actions-list">
                </div>

            </div>

        </div>

    </div>
</div>
